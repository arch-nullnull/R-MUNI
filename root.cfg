# =============================================================
# root.cfg — R+MUNI Blueprint Konfiguration
# =============================================================
# Ablageort : Blueprint Root  (z.B. C:\Prototyping\R+MUNI\)
# Zweck     : Einzige Quelle aller Pfad-Variablen im Blueprint
# =============================================================
#
# NUR DIESE ZEILE ANPASSEN wenn der Blueprint nicht unter
# C:\Prototyping\R+MUNI installiert ist:
#
<rootfolder>=C:\Prototyping\R+MUNI
#
# =============================================================
# AB HIER NICHTS ÄNDERN — wird automatisch aus <rootfolder>
# abgeleitet oder ist nach Installations-Standard fix.
# =============================================================

# --- Blueprint Unterordner (unter <rootfolder>) --------------
<models>=<rootfolder>\00-model
<artifacts>=<rootfolder>\01-artifacts
<stages>=<rootfolder>\02-stages

# --- Geschwister-Ordner (neben <rootfolder>) -----------------
<apps>=C:\Prototyping\R+MUNI Apps
<doku>=C:\Prototyping\R+MUNI Doku\R+MUNI Doku-internal
<dokupublic>=C:\Prototyping\R+MUNI Doku\R+MUNI Doku-public
<creative>=C:\Prototyping\R+MUNI Doku\R+MUNI Doku-creative

# =============================================================
# HINWEIS ZU GESCHWISTER-ORDNERN:
# <apps>, <doku>, <dokupublic>, <creative> liegen nicht unter
# <rootfolder> sondern daneben — sie folgen dem Namensschema
# "R+MUNI *" auf derselben Ebene wie der Blueprint-Ordner.
# Bei abweichendem Basispfad diese Zeilen ebenfalls anpassen.
# =============================================================
#
# Beispiel alternatives Installationsverzeichnis:
#   <rootfolder>=D:\Projekte\MUNI
#   <apps>=D:\Projekte\MUNI Apps
#   <doku>=D:\Projekte\MUNI Doku\MUNI Doku-internal
#   ... usw.
#
# =============================================================
# root.cfg | R+MUNI Blueprint | Stage 5 | Cleaning Run 5.5
# =============================================================
