<svg width="100%" viewBox="0 0 680 545" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Optionale Leistungen — R+MUNI</title>
<desc>Übersicht der optionalen R+MUNI Leistungen: Setup, Schulung, Support</desc>
<defs>
<style>
text { font-family: sans-serif; fill: #1a1a1a; }
.th  { font-size: 14px; font-weight: 600; }
.ts  { font-size: 12px; font-weight: 400; }
.muted { fill: #555550; }
</style>
</defs>

<!-- TITEL -->
<text class="th" x="340" y="26" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#1a1a1a">Optionale Leistungen</text>

<!-- UNTERTITEL -->
<rect x="28" y="40" width="624" height="26" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="ts muted" x="340" y="53" text-anchor="middle" dominant-baseline="central">Das System ist kostenlos. Wer Unterstützung möchte — hier ist der Rahmen.</text>

