<text class="ts muted" x="340" y="398" text-anchor="middle" dominant-baseline="central">Muniversum einführen</text>
<text class="ts muted" x="340" y="416" text-anchor="middle" dominant-baseline="central">lassen will.</text>

<rect x="256" y="512" width="168" height="24" rx="6" fill="#534AB7"/>
<text class="ts" x="340" y="524" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-weight="600">Kapazität entscheidet</text>

