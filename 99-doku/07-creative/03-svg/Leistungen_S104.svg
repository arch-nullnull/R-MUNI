<text class="ts" x="340" y="283" text-anchor="middle" dominant-baseline="central" fill="#26215C" font-weight="600">Anwenderschulung</text>

<rect x="256" y="298" width="168" height="26" rx="6" fill="#AFA9EC" stroke="#534AB7" stroke-width="0.5"/>
